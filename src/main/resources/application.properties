# 1. Database Connection URL (wine_store is the database name)
#This tells the app to look at your local machine (localhost) on port 3306 for the wine_store database
spring.datasource.url=jdbc:mysql://localhost:3306/wine_store

# 2. Your MySQL Username (usually root)
spring.datasource.username=root

# 3. YOUR actual MySQL password
spring.datasource.password=root

# 4. Driver class name
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# 5. Hibernate Settings (Automatically creates/updates tables based on your Java code)
#update means it will create tables if they don't exist and update them if they do (without deleting data)
#This is very helpful for beginners. It means if you change your Java "Entity" classes later, Spring Boot will automatically try to update your MySQL tables to match.
spring.jpa.hibernate.ddl-auto=update

# 6. Show SQL in console (Helpful for debugging)
#This will print the actual SQL queries that Hibernate generates to the console. It's useful for seeing what's happening behind the scenes and for debugging.
#When you run the app, you will see the actual SQL commands in your VS Code terminal. This is great for seeing how the "Snapshots" or "Sales Records" are being saved
spring.jpa.show-sql=true